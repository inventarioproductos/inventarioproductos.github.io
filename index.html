
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183b35">
  <title>Ficha del producto</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f6f3;
      color: #17221e;
      font-family: Arial, sans-serif;
    }

    .producto {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 12px #00000012;
    }

    .producto img {
      display: block;
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 15px;
    }

    .categoria {
      color: #557168;
      font-size: 13px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .descripcion {
      color: #65716c;
      line-height: 1.5;
    }

    .precio {
      font-size: 26px;
      font-weight: bold;
      margin: 18px 0;
    }

    .dato {
      padding: 10px 0;
      border-bottom: 1px solid #e5e9e5;
      line-height: 1.5;
    }

    .mensaje {
      text-align: center;
      padding: 30px 10px;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .producto {
        padding: 15px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main id="app" class="mensaje">
    Cargando producto...
  </main>

  <script>
    async function mostrarProducto() {
      const app = document.getElementById("app");
      const parametros = new URLSearchParams(
        window.location.search
      );
      const id = parametros.get("id");

      if (!id) {
        app.innerHTML = `
          <div class="mensaje">
            <h2>Producto no especificado</h2>
            <p>Escanea el código QR de un producto.</p>
          </div>
        `;
        return;
      }

      try {
        const respuesta = await fetch("./products.json");

        if (!respuesta.ok) {
          throw new Error("No se pudo cargar el inventario");
        }

        const productos = await respuesta.json();

        const producto = productos.find(
          p => String(p.id) === id
        );

        if (!producto) {
          app.innerHTML = `
            <div class="mensaje">
              <h2>Producto no encontrado</h2>
              <p>Verifica que el código QR sea correcto.</p>
            </div>
          `;
          return;
        }

        const escapar = valor =>
          String(valor ?? "No disponible").replace(
            /[&<>"']/g,
            caracter => ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;"
            })[caracter]
          );

        const dinero = valor => {
          const numero = Number(valor);

          return valor !== "" &&
            valor !== null &&
            Number.isFinite(numero)
            ? numero.toLocaleString("es-MX", {
                style: "currency",
                currency: "MXN"
              })
            : escapar(valor || "No disponible");
        };

        app.className = "producto";

        app.innerHTML = `
          ${
            producto.image
              ? `<img
                   src="${escapar(producto.image)}"
                   alt="${escapar(producto.name)}"
                 >`
              : ""
          }

          <div class="categoria">
            ${escapar(producto.category)}
          </div>

          <h1>${escapar(producto.name)}</h1>

          ${
            producto.description
              ? `<p class="descripcion">
                   ${escapar(producto.description)}
                 </p>`
              : ""
          }

          <div class="precio">
            ${dinero(producto.price)}
          </div>

          <div class="dato">
            <strong>Código:</strong>
            ${escapar(producto.barcode || producto.id)}
          </div>

          <div class="dato">
            <strong>Cantidad:</strong>
            ${escapar(producto.quantity)}
            ${escapar(producto.unit || "")}
          </div>

          ${
            producto.expiration &&
            producto.expiration !== "No aplica"
              ? `<div class="dato">
                   <strong>Caducidad:</strong>
                   ${escapar(producto.expiration)}
                 </div>`
              : ""
          }
        `;

        document.title = producto.name + " - Ficha del producto";

      } catch (error) {
        app.innerHTML = `
          <div class="mensaje">
            <h2>No se pudo cargar el producto</h2>
            <p>Comprueba que products.json y la carpeta
            images estén publicados correctamente.</p>
          </div>
        `;
      }
    }

    mostrarProducto();
  </script>
</body>
</html>
